# NOTE: On clarksonjeremy909, GitHub-hosted runners currently fail to assign
# (jobs finish in ~1–4s with empty runner_name / steps=0). Until that is fixed,
# build Windows locally with scripts/build-windows.ps1 and upload the zip to the Release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter version
        run: flutter --version

      - name: Ensure Windows platform files
        shell: bash
        run: |
          if [ ! -f windows/CMakeLists.txt ]; then
            flutter create --platforms=windows --org com.aktifdesk .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package zip
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          if (-not (Test-Path $out)) { throw "Release output folder not found: $out" }
          Get-ChildItem $out
          Compress-Archive -Path "$out/*" -DestinationPath "AktifDesk-windows-x64.zip" -Force
          Get-Item AktifDesk-windows-x64.zip | Format-List Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: AktifDesk-windows-x64
          path: AktifDesk-windows-x64.zip
          if-no-files-found: error

  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AktifDesk-android.apk
          ls -l AktifDesk-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AktifDesk-android
          path: AktifDesk-android.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AktifDesk ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/AktifDesk-windows-x64.zip
            dist/AktifDesk-android.apk
